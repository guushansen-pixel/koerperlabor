<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Körper-Labor</title>
<style>
:root {
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --bg: #12171E; --card: #1B222C; --line: #2A3441; --txt: #E8EDF2; --muted: #93A0AF;
  --acc: #3FB6A8; --good: #4CC38A; --bad: #E5674F; --warn: #E0A93B;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 8px) 14px calc(var(--sab) + 28px); }
header { display: flex; align-items: center; gap: 8px; height: 48px; }
header h1 { font-size: 20px; margin: 0; flex: 1; }
#back { background: none; border: 0; color: var(--txt); font-size: 30px; line-height: 1; padding: 0 12px 4px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); } .small { font-size: 13px; } .good { color: var(--good); } .bad { color: var(--bad); }
.big { font-size: 34px; font-weight: 700; line-height: 1.15; }
button { font: inherit; color: var(--txt); background: #26303D; border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; }
button.primary { background: var(--acc); border-color: var(--acc); color: #06201D; font-weight: 700; }
button.block { display: block; width: 100%; margin-top: 8px; }
button.ghost { background: none; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid button { text-align: left; } .grid button span { display: block; font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; } .row > .grow { flex: 1; }
.item { display: flex; align-items: baseline; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; } .item > div.grow { flex: 1; } .item b { white-space: nowrap; }
label.c { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
canvas.chart { width: 100%; height: 130px; display: block; }
.bar { height: 8px; background: #0E1319; border-radius: 4px; overflow: hidden; margin: 14px 0; }
.bar i { display: block; height: 100%; width: 0; background: var(--acc); }
ul { margin: 6px 0; padding-left: 20px; } li { margin: 4px 0; }
textarea.mono { width: 100%; height: 110px; background: #0E1319; color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: 12px/1.4 monospace; }

/* Mess-Ansicht: Vollbild ueber der App */
#meas { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(var(--sat) + 8px) 16px calc(var(--sab) + 16px); touch-action: manipulation; }
#meas[hidden], #modal[hidden] { display: none; }
#m-top { display: flex; align-items: center; gap: 8px; min-height: 44px; }
#m-title { flex: 1; font-size: 20px; font-weight: 700; }
#m-quit { font-size: 13px; padding: 7px 12px; }
#m-body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
#m-body .center { text-align: center; }
.pad { flex: 1; border-radius: 18px; background: #26303D; border: 1px solid var(--line); display: flex; align-items: center;
  justify-content: center; font-size: 26px; font-weight: 700; margin: 12px 0; user-select: none; text-align: center; padding: 12px; }
.pad.go { background: var(--acc); color: #06201D; } .pad.err { background: #4A2622; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.keys button { font-size: 22px; padding: 14px 0; }
canvas.trace { width: 100%; height: 90px; display: block; margin-top: 10px; }
#rs-ball { width: 150px; height: 150px; border-radius: 50%; margin: 6px auto 10px; background: radial-gradient(circle, var(--acc), #1E5F58); transform: scale(.45); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
.chips button.on { background: var(--acc); border-color: var(--acc); color: #06201D; font-weight: 600; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; } table.t td { padding: 4px 6px; border-top: 1px solid var(--line); text-align: right; } table.t td:first-child { text-align: left; }
.digit { font-size: 90px; font-weight: 700; text-align: center; min-height: 130px; }
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
#modal > div { background: var(--card); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 16px 16px calc(var(--sab) + 16px); }
#modal h3 { margin: 0 0 6px; }
.btns { display: flex; gap: 8px; margin-top: 12px; } .btns button { flex: 1; }
</style>
</head>
<body>
<div id="app">
  <header><button id="back" aria-label="Zurück">‹</button><h1 id="title">Körper-Labor</h1></header>
  <main id="view"></main>
</div>
<div id="meas" hidden>
  <div id="m-top"><span id="m-title"></span><button id="m-quit">Abbrechen</button></div>
  <div id="m-step" class="muted small"></div>
  <div id="m-body"></div>
</div>
<div id="modal" hidden><div id="modal-in"></div></div>

<script>
'use strict';
// =====================================================================
// Koerper-Labor: kurze Selbstmessungen mit den Sensoren des Handys
// (Kamera fuer Puls/HRV, Beschleunigungssensor fuer Atem, Sprung, Zittern,
// Balance) und drei Kopf-Tests. Messgenauigkeit und Grenzen siehe README.md.
// Aufbau: Daten -> Signalverarbeitung (rein, im Selbsttest abgedeckt)
//         -> Sensoren -> Testablauf -> Ansichten -> Export -> Selbsttest.
// =====================================================================
const $ = id => document.getElementById(id);
const NATIVE = window.KlAndroid;

// ---------------------------------------------------------------- Daten
const K = { set: 'koerperlabor.settings.v1', days: 'koerperlabor.days.v1' };
const DEFAULT_SETTINGS = { schema: 1, check: ['puls', 'reaktion', 'tapping', 'zittern', 'sprung'], sound: true, lastExport: null };
let saveOk = true;
function load(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { saveOk = false; } }
const db = { settings: Object.assign({}, DEFAULT_SETTINGS, load(K.set, {})), days: load(K.days, {}) };
function saveAll() { store(K.set, db.settings); store(K.days, db.days); }
function migrate() { if (!db.settings.schema) db.settings.schema = 1; }
migrate();

function dstr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return dstr(new Date()); }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
function wdName(date) { return WD[new Date(date + 'T12:00').getDay()]; }
function dShort(s) { return s.slice(8, 10) + '.' + s.slice(5, 7) + '.'; }
function fmt(v, d) { return Number(v).toFixed(d).replace('.', ','); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// Messgroessen: [Test, Feld, Beschriftung, Einheit, Nachkommastellen, Feld im Health OS]
const METRICS = [
  { k: 'puls', f: 'hr', label: 'Puls', unit: '/min', d: 0, json: 'lab_puls' },
  { k: 'puls', f: 'rmssd', label: 'HRV (RMSSD)', unit: 'ms', d: 0, json: 'lab_rmssd' },
  { k: 'reaktion', f: 'ms', label: 'Reaktion', unit: 'ms', d: 0, json: 'lab_reaktion_ms' },
  { k: 'wach', f: 'ms', label: 'Wach-Check Reaktion', unit: 'ms', d: 0, json: 'lab_wach_ms' },
  { k: 'wach', f: 'lapses', label: 'Wach-Check Aussetzer', unit: 'mal', d: 0, json: 'lab_wach_aussetzer' },
  { k: 'tapping', f: 'tps', label: 'Tapping', unit: '/s', d: 1, json: 'lab_tapping' },
  { k: 'merken', f: 'span', label: 'Zahlen merken', unit: 'Ziffern', d: 0, json: 'lab_merken' },
  { k: 'zittern', f: 'mg', label: 'Zittern', unit: 'mg', d: 1, json: 'lab_zittern_mg' },
  { k: 'balance', f: 'mg', label: 'Balance (Schwanken)', unit: 'mg', d: 1, json: 'lab_balance_mg' },
  { k: 'sprung', f: 'cm', label: 'Sprung', unit: 'cm', d: 1, json: 'lab_sprung_cm' },
  { k: 'atem', f: 'bpm', label: 'Atemzüge', unit: '/min', d: 1, json: 'lab_atem' },
  // Ohne json: erscheint in der App und im Verlauf, geht aber nicht in den Health-OS-Export.
  { k: 'tempo', f: 'rueck', label: 'Tempo Ablassen', unit: 's', d: 1 },
  { k: 'tritt', f: 'spm', label: 'Trittfrequenz', unit: '/min', d: 0 },
  { k: 'resonanz', f: 'rate', label: 'Resonanz-Atmung', unit: '/min', d: 1 }];
const MIN_QUALITY = 0.6;
// Wert einer Messgroesse an einem Tag; HRV nur bei brauchbarem Signal.
function val(day, m) {
  const r = day && day[m.k]; if (!r || r[m.f] == null) return null;
  if (m.k === 'puls' && m.f === 'rmssd' && !(r.quality >= MIN_QUALITY)) return null;
  return r[m.f];
}
function median(a) { if (!a.length) return NaN; const s = Array.from(a).sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; }
// Eigener Schnitt: Median der bis zu 14 letzten frueheren Tage, ab 3 Werten.
function baseline(m, days, before) {
  const v = Object.keys(days).filter(d => d < before).sort().slice(-14).map(d => val(days[d], m)).filter(x => x != null);
  return v.length >= 3 ? median(v) : null;
}

// ---------------------------------------------------------------- Signalverarbeitung
function mean(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return a.length ? s / a.length : NaN; }
function std(a) { const m = mean(a); let s = 0; for (let i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m); return a.length ? Math.sqrt(s / a.length) : NaN; }
// Zentrierter gleitender Mittelwert ueber w Werte (an den Raendern kuerzer).
function movAvg(x, w) {
  const n = x.length, out = new Float64Array(n), h = Math.floor(w / 2), pre = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) pre[i + 1] = pre[i] + x[i];
  for (let i = 0; i < n; i++) { const a = Math.max(0, i - h), b = Math.min(n - 1, i + h); out[i] = (pre[b + 1] - pre[a]) / (b - a + 1); }
  return out;
}
function sub(a, b) { const o = new Float64Array(a.length); for (let i = 0; i < a.length; i++) o[i] = a[i] - b[i]; return o; }
// Ungleichmaessige Abtastung (Zeiten in s) linear auf ein festes Raster bringen.
function resample(ts, xs, hz) {
  if (ts.length < 2) return new Float64Array(0);
  const n = Math.max(0, Math.floor((ts[ts.length - 1] - ts[0]) * hz)), out = new Float64Array(n);
  let j = 0;
  for (let i = 0; i < n; i++) {
    const t = ts[0] + i / hz; while (j < ts.length - 2 && ts[j + 1] < t) j++;
    const d = ts[j + 1] - ts[j]; out[i] = d > 0 ? xs[j] + (xs[j + 1] - xs[j]) * (t - ts[j]) / d : xs[j];
  }
  return out;
}

// Puls aus dem Helligkeitsverlauf der Kamera (Finger auf Linse und Blitz).
// ts in s, vs = mittlere Helligkeit eines Farbkanals. Die ersten skip Sekunden
// fallen weg (Belichtung regelt nach). Liefert {hr, rmssd, quality, beats}.
const PPG_HZ = 30;
function analyzePPG(ts, vs, skip) {
  let k = 0; while (k < ts.length && ts[k] < (skip || 0)) k++;
  const t = ts.slice(k), v = vs.slice(k);
  if (t.length < PPG_HZ * 8) return null;
  const x = resample(t, v, PPG_HZ), hp = sub(x, movAvg(x, PPG_HZ + 1)), sm = movAvg(hp, 5), n = sm.length;
  const y = new Float64Array(n); for (let i = 0; i < n; i++) y[i] = -sm[i];     // Herzschlag = Helligkeit faellt
  const cand = []; for (let i = 1; i < n - 1; i++) if (y[i] > 0 && y[i] >= y[i - 1] && y[i] > y[i + 1]) cand.push(i);
  if (cand.length < 6) return null;
  const amps = cand.map(i => y[i]).sort((a, b) => a - b), ref = median(amps.slice(amps.length >> 1));
  const keep = [];
  cand.filter(i => y[i] >= 0.4 * ref).forEach(i => {
    const l = keep[keep.length - 1];
    if (l !== undefined && i - l < PPG_HZ * 0.33) { if (y[i] > y[l]) keep[keep.length - 1] = i; } else keep.push(i);
  });
  // Gipfelzeit per Parabel durch drei Punkte genauer als das 33-ms-Raster
  const pt = keep.map(i => { const d = y[i - 1] - 2 * y[i] + y[i + 1]; return (i + (d ? 0.5 * (y[i - 1] - y[i + 1]) / d : 0)) / PPG_HZ; });
  const ibi = []; for (let i = 1; i < pt.length; i++) ibi.push(pt[i] - pt[i - 1]);
  const plaus = ibi.filter(d => d >= 0.33 && d <= 1.5);
  if (plaus.length < 5) return null;
  const med = median(plaus), ok = ibi.map(d => Math.abs(d - med) <= 0.25 * med), good = ibi.filter((d, i) => ok[i]);
  let sq = 0, c = 0;
  for (let i = 1; i < ibi.length; i++) if (ok[i] && ok[i - 1]) { sq += (ibi[i] - ibi[i - 1]) * (ibi[i] - ibi[i - 1]); c++; }
  return { hr: 60 / mean(good), rmssd: c >= 10 ? Math.sqrt(sq / c) * 1000 : null, quality: good.length / ibi.length, beats: good.length, t: pt.slice(1), ibi, okIbi: ok };
}
// Besseren der beiden Farbkanaele nehmen (Rot uebersteuert mit Blitz auf manchen Geraeten).
function bestPPG(S, skip) {
  const a = analyzePPG(S.t, S.r, skip), b = analyzePPG(S.t, S.g, skip), score = r => r ? r.quality * r.beats : -1;
  const best = score(a) >= score(b) ? a : b;
  return best ? { hr: Math.round(best.hr * 10) / 10, rmssd: best.rmssd == null ? null : Math.round(best.rmssd), quality: Math.round(best.quality * 100) / 100, kanal: best === a ? 'rot' : 'gruen' } : null;
}

// Spruenge: Im Flug misst der Sensor fast 0 (freier Fall). Flugzeit T zwischen
// Unter- und Ueberschreiten von 0,5 g, Hoehe = g*T²/8. mag = Betrag inkl. Schwerkraft in m/s².
function analyzeJump(ts, mag) {
  // Geglaettet wird nur, um die Flugphase zu finden (ein Ausreisser soll sie nicht
  // teilen); Anfang und Ende werden an den ungeglaetteten Werten bestimmt, weil
  // die Glaettung die steilen Flanken verschiebt und die Flugzeit verkuerzt.
  const m = movAvg(mag, 3), out = [], LOW = 3, THR = 4.9, n = ts.length;
  const cross = (i0, i1) => { const d = mag[i1] - mag[i0]; return d ? ts[i0] + (THR - mag[i0]) / d * (ts[i1] - ts[i0]) : ts[i1]; };
  let i = 0;
  while (i < n) {
    if (m[i] < LOW) {
      let a = i, b = i; while (a > 0 && m[a - 1] < THR) a--; while (b < n - 1 && m[b + 1] < THR) b++;
      let s = Math.max(0, a - 2), e = Math.min(n - 1, b + 2);
      while (s < e && mag[s] >= THR) s++; while (e > s && mag[e] >= THR) e--;
      const T = (e < n - 1 ? cross(e, e + 1) : ts[e]) - (s > 0 ? cross(s - 1, s) : ts[s]);
      if (T >= 0.15 && T <= 0.9) out.push(Math.round(9.81 * T * T / 8 * 1000) / 10);
      i = b + 1;
    } else i++;
  }
  return out;
}
// Atmung: Das Handy auf dem Bauch kippt mit jedem Atemzug leicht. Achse mit der
// groessten langsamen Schwankung nehmen, Atemzuege als Aufwaerts-Durchgaenge zaehlen.
function analyzeBreath(S) {
  const HZ = 25; let best = null;
  ['x', 'y', 'z'].forEach(k => {
    const r = resample(S.t, S[k], HZ); if (r.length < HZ * 20) return;
    const y = movAvg(sub(r, movAvg(r, HZ * 8 + 1)), 37), sd = std(y);
    if (!best || sd > best.sd) best = { y, sd };
  });
  if (!best || !(best.sd > 0.002)) return null;
  const y = best.y, th = 0.3 * best.sd, ups = []; let armed = false;
  for (let i = 0; i < y.length; i++) { if (y[i] < -th) armed = true; else if (armed && y[i] > th) { ups.push(i / HZ); armed = false; } }
  if (ups.length < 3) return null;
  const iv = []; for (let i = 1; i < ups.length; i++) iv.push(ups[i] - ups[i - 1]);
  const mi = mean(iv);
  return { bpm: Math.round(60 / mi * 10) / 10, cv: Math.round(std(iv) / mi * 100) / 100, breaths: ups.length };
}
// Ruhighalten: mittlere Beschleunigung in einem Frequenzband, in Milli-g.
// 'zittern' = schnelle Anteile (ab etwa 3 Hz), 'balance' = langsames Schwanken (0,2-2,5 Hz).
function analyzeSteady(S, mode) {
  const HZ = 50, ax = ['x', 'y', 'z'].map(k => resample(S.t, S[k], HZ)), n = ax[0].length;
  if (n < HZ * 5) return null;
  const f = ax.map(r => mode === 'zittern' ? sub(r, movAvg(r, 13)) : sub(movAvg(r, 11), movAvg(r, 201)));
  let s = 0, c = 0;
  for (let i = HZ; i < n - HZ; i++) { s += f[0][i] * f[0][i] + f[1][i] * f[1][i] + f[2][i] * f[2][i]; c++; }
  return { mg: Math.round(Math.sqrt(s / c) / 9.81 * 1000 * 10) / 10 };
}

// Wach-Check (Daueraufmerksamkeit): aus den Reaktionszeiten den Median, die Zahl der
// Aussetzer (ab LAPSE_MS, verpasste Reize zaehlen mit) und das langsamste Zehntel.
const LAPSE_MS = 500;
function pvtStats(rts) {
  if (rts.length < 5) return null;
  const s = Array.from(rts).sort((a, b) => a - b), k = Math.max(1, Math.round(s.length / 10));
  return { ms: Math.round(median(s)), lapses: s.filter(v => v >= LAPSE_MS).length, n: s.length, slow: Math.round(mean(s.slice(-k))) };
}

// Resonanzfrequenz-Suche: Wie stark schwingt der Puls im Atemtakt? bt = Zeit am Ende jedes
// Schlagabstands (s), ibi = Schlagabstaende (s), ok = brauchbar?, perMin = Atemzuege pro Minute.
// Der Pulsverlauf wird auf 4 Hz gebracht und sein Anteil genau bei der Atemfrequenz bestimmt
// (ueber ganze Atemzuege). Ergebnis: Schwankung von Tal zu Gipfel in Schlaegen pro Minute.
function rsaSwing(bt, ibi, ok, perMin) {
  const ts = [], hs = []; for (let i = 0; i < ibi.length; i++) if (ok[i]) { ts.push(bt[i] - ibi[i] / 2); hs.push(60 / ibi[i]); }
  if (ts.length < 20) return null;
  const HZ = 4, x = resample(ts, hs, HZ), per = HZ * 60 / perMin, n = Math.floor(Math.floor(x.length / per) * per);
  if (n < per * 3) return null;
  let m = 0; for (let i = 0; i < n; i++) m += x[i]; m /= n;
  let c = 0, q = 0; const w = 2 * Math.PI / per;
  for (let i = 0; i < n; i++) { c += (x[i] - m) * Math.cos(w * i); q += (x[i] - m) * Math.sin(w * i); }
  return Math.round(4 * Math.sqrt(c * c + q * q) / n * 10) / 10;
}
// Beste Stufe: groesste Schwankung unter den Stufen mit brauchbarem Signal.
function resonanzBest(list) { const g = list.filter(x => x.swing != null && x.q >= MIN_QUALITY); return g.length ? g.reduce((a, b) => b.swing > a.swing ? b : a) : null; }

// Tempo-Waechter: Das Handy sitzt an einem Koerperteil, der bei der Uebung kippt (Unterarm,
// Oberschenkel, Oberarm). Aus der Richtung der Schwerkraft wird ein Kippwinkel, aus dessen
// Umkehrpunkten die Dauer jeder Hin- und Rueckbewegung.
function tempoAngle(S) {
  const HZ = 25, ax = ['x', 'y', 'z'].map(k => movAvg(resample(S.t, S[k], HZ), 7)), n = ax[0].length;
  if (n < HZ * 2) return null;
  const rng = ax.map(a => { let lo = Infinity, hi = -Infinity; for (let i = 0; i < n; i++) { if (a[i] < lo) lo = a[i]; if (a[i] > hi) hi = a[i]; } return hi - lo; });
  const rot = rng.indexOf(Math.min(rng[0], rng[1], rng[2])), pl = [0, 1, 2].filter(i => i !== rot);     // Drehachse = Achse, die sich am wenigsten aendert
  if (Math.max(rng[pl[0]], rng[pl[1]]) < 2.5) return null;                                              // keine Kippbewegung
  const ang = new Float64Array(n); let prev = 0, off = 0;
  for (let i = 0; i < n; i++) { const a = Math.atan2(ax[pl[0]][i], ax[pl[1]][i]); if (i) { if (a - prev > Math.PI) off -= 2 * Math.PI; else if (a - prev < -Math.PI) off += 2 * Math.PI; } prev = a; ang[i] = a + off; }
  return { hz: HZ, ang };
}
// Phasen zwischen Umkehrpunkten (Umkehr gilt ab H rad Gegenbewegung). Dauer = Zeit von 10 % bis
// 90 % des Wegs, hochgerechnet: Pausen oben und unten zaehlen so nicht zur Bewegung.
function tempoPhases(ang, hz, H) {
  const n = ang.length, out = []; H = H || 0.3;
  const add = (a, b, open) => {
    const tr = ang[b] - ang[a]; let i10 = a, i90 = b;

// Trittfrequenz: Schritte pro Minute aus dem Betrag der Beschleunigung. Gesucht wird der

  const peaks = []; for (let l = L0; l <= L1; l++) if (r[l] > r[l - 1] && r[l] >= r[l + 1]) peaks.push(l);

}

// Kamera: liefert pro Bild die mittlere Helligkeit je Farbkanal.
const Cam = {
  async open() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Kein Kamerazugriff in dieser Umgebung');
    const base = { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 30 } };
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: Object.assign({ facingMode: { exact: 'environment' } }, base) }); }
    catch (e) { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true }); }
    const video = document.createElement('video');
    video.playsInline = true; video.muted = true; video.srcObject = stream;
    video.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none';
    document.body.appendChild(video);
    try { await video.play(); } catch (e) {}
    const track = stream.getVideoTracks()[0];
    let torch = false;
    try { await track.applyConstraints({ advanced: [{ torch: true }] }); torch = !!(track.getSettings && track.getSettings().torch); } catch (e) {}
    const cv = document.createElement('canvas'); cv.width = cv.height = 24;

    const o = { torch, closed: false, frames: 0, onFrame: null, settings: track.getSettings ? track.getSettings() : {},
      close() { if (o.closed) return; o.closed = true; clearTimeout(o.timer); try { track.stop(); } catch (e) {} video.remove(); } };
    let last = 0;
    const grab = t => {
      if (o.closed) return;
      try {
        ctx.drawImage(video, 0, 0, 24, 24); const d = ctx.getImageData(0, 0, 24, 24).data; let r = 0, g = 0, b = 0;
        for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
        o.frames++; last = performance.now(); o.onFrame && o.onFrame(t, r / 576, g / 576, b / 576);
      } catch (e) {}
    };
    // Bildgenau, wenn der Browser es kann; sonst (oder wenn nichts kommt) im 33-ms-Takt.
    const viaFrame = (now, meta) => { if (o.closed) return; grab(meta && meta.mediaTime > 0 ? meta.mediaTime * 1000 : now); video.requestVideoFrameCallback(viaFrame); };

// Beschleunigungssensor: sammelt (t, x, y, z) inklusive Schwerkraft, bis stop() gerufen wird.
function motionRecorder() {

}

function drawTrace(cv, v) {
  const k = window.devicePixelRatio || 1, W = cv.clientWidth || 300, H = cv.clientHeight || 90, c = cv.getContext('2d');
  cv.width = W * k; cv.height = H * k; c.scale(k, k); c.clearRect(0, 0, W, H);
  if (v.length < 2) return;
  const lo = Math.min.apply(null, v), hi = Math.max.apply(null, v), sp = hi - lo || 1;
  c.strokeStyle = '#3FB6A8'; c.lineWidth = 2; c.beginPath();
  v.forEach((y, i) => { const X = i / (v.length - 1) * W, Y = H - 4 - (y - lo) / sp * (H - 8); if (i) c.lineTo(X, Y); else c.moveTo(X, Y); });
  c.stroke();
}

// Reine Formatfunktion: eine Zeile pro Messwert, darunter der Tag als JSON.
function labText(d) {
  const L = ['KOERPERLABOR ' + d.datum + ' (' + wdName(d.datum) + ')' + (d.zeit ? ' ' + d.zeit : '')];
  METRICS.forEach(m => { const v = val(d, m); if (m.json && v != null) L.push(m.label + ': ' + v + ' ' + m.unit); });
  if (d.puls && !(d.puls.quality >= MIN_QUALITY)) L.push('HRV: nicht gewertet (Signal ' + Math.round((d.puls.quality || 0) * 100) + ' %)');
  if (d.reaktion && d.reaktion.fehl) L.push('Fehlstarts Reaktion: ' + d.reaktion.fehl);

// ---------------------------------------------------------------- Diagramm
function drawChart(cv, pts, m) {
  const k = window.devicePixelRatio || 1, W = cv.clientWidth || 300, H = cv.clientHeight || 130, c = cv.getContext('2d');
  cv.width = W * k; cv.height = H * k; c.scale(k, k); c.clearRect(0, 0, W, H);
  c.font = '11px system-ui, sans-serif'; c.fillStyle = '#93A0AF';
  let x0 = Math.min.apply(null, pts.map(p => p.x)), x1 = Math.max.apply(null, pts.map(p => p.x));
  let y0 = Math.min.apply(null, pts.map(p => p.y)), y1 = Math.max.apply(null, pts.map(p => p.y));
  if (x0 === x1) { x0 -= 43200000; x1 += 43200000; }
  const pad = (y1 - y0) * 0.15 || Math.abs(y1) * 0.1 || 1; y0 -= pad; y1 += pad;
  const L = 44, R = 10, T = 8, B = 18, X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (y1 - y) / (y1 - y0) * (H - T - B);
  c.strokeStyle = '#2A3441'; c.lineWidth = 1; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let i = 0; i <= 2; i++) { const v = y0 + (y1 - y0) * i / 2, yy = Y(v); c.beginPath(); c.moveTo(L, yy); c.lineTo(W - R, yy); c.stroke(); c.fillText(fmt(v, m.d), L - 6, yy); }
  c.textBaseline = 'alphabetic'; c.textAlign = 'left'; c.fillText(dShort(dstr(new Date(x0))), L, H - 3);
  c.textAlign = 'right'; c.fillText(dShort(dstr(new Date(x1))), W - R, H - 3);
  c.strokeStyle = c.fillStyle = '#3FB6A8'; c.lineWidth = 2; c.beginPath();
  pts.forEach((p, i) => { if (i) c.lineTo(X(p.x), Y(p.y)); else c.moveTo(X(p.x), Y(p.y)); }); c.stroke();
  pts.forEach(p => { c.beginPath(); c.arc(X(p.x), Y(p.y), 3, 0, 2 * Math.PI); c.fill(); });
}

function klTests() {
  let ok = 0, fail = 0;

  let seed = 4711; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
  const near = (a, b, tol) => Math.abs(a - b) <= tol;

  t('movAvg glaettet Konstante nicht', Array.from(movAvg([5, 5, 5, 5, 5], 3)).every(v => v === 5));
  t('resample: Gerade bleibt Gerade', near(resample([0, 0.5, 1, 2], [0, 5, 10, 20], 10)[7], 7, 1e-9));
  t('median', median([3, 1, 2]) === 2 && median([4, 1, 3, 2]) === 2.5);

  // Puls: kuenstliches Kamerasignal mit bekannten Schlagabstaenden, ~30 Bilder/s mit Jitter
  const ppg = (ibiFn, sec, noise) => {
    const beats = []; let tb = 0.4; while (tb < sec + 1) { beats.push(tb); tb += ibiFn(tb); }
    const ts = [], vs = []; let tt = 0;
    while (tt < sec) {
      let v = 200 + 3 * Math.sin(tt * 0.3) + (rnd() - 0.5) * noise;
      for (let i = 0; i < beats.length; i++) { const d = tt - beats[i]; if (d > -0.5 && d < 0.5) v -= 2.5 * Math.exp(-d * d / (2 * 0.07 * 0.07)); }
      ts.push(tt); vs.push(v); tt += 1 / 30 + (rnd() - 0.5) * 0.004;
    }
    const ib = []; for (let i = 1; i < beats.length; i++) ib.push(beats[i] - beats[i - 1]);
    let s = 0; for (let i = 1; i < ib.length; i++) s += (ib[i] - ib[i - 1]) * (ib[i] - ib[i - 1]);
    return { ts, vs, rmssd: Math.sqrt(s / (ib.length - 1)) * 1000 };
  };
  let P = ppg(() => 60 / 72, 60, 0.4), A = analyzePPG(P.ts, P.vs, 4);

  t('Puls 72: Signalqualitaet', A && A.quality > 0.95, A && A.quality);
  t('HRV-Grundrauschen bei gleichmaessigem Puls unter 12 ms', A && A.rmssd < 12, A && A.rmssd.toFixed(1));
  P = ppg(tb => 1.0 + 0.06 * Math.sin(2 * Math.PI * 0.1 * tb), 60, 0.4); A = analyzePPG(P.ts, P.vs, 4);
  t('Puls 60 mit Atemschwankung', A && near(A.hr, 60, 1.2), A && A.hr.toFixed(2));
  t('HRV liegt in der Naehe des wahren Werts', A && near(A.rmssd, P.rmssd, 10), A && (A.rmssd.toFixed(1) + ' statt ' + P.rmssd.toFixed(1)));
  P = ppg(() => 60 / 110, 40, 0.4); A = analyzePPG(P.ts, P.vs, 4);
  t('Puls 110 erkannt', A && near(A.hr, 110, 1.5), A && A.hr.toFixed(2));
  const noiseT = [], noiseV = []; for (let i = 0; i < 1500; i++) { noiseT.push(i / 30); noiseV.push(200 + (rnd() - 0.5) * 2); }
  A = analyzePPG(noiseT, noiseV, 0);
  t('reines Rauschen: kein brauchbares Signal', !A || A.quality < MIN_QUALITY, A && A.quality);
  t('zu kurze Messung liefert nichts', analyzePPG([0, 1, 2], [1, 2, 3], 0) === null);

  // Sprung: stehen, abdruecken, 0,4 s Flug, landen
  const jump = T => {
    const ts = [], mag = [];
    for (let i = 0; i < 300; i++) {
      const tt = i / 60, a = tt < 1 ? 9.81 : tt < 1.2 ? 22 : tt < 1.2 + T ? 0.4 : tt < 1.35 + T ? 30 : 9.81;
      ts.push(tt); mag.push(a + (rnd() - 0.5) * 0.3);
    }
    return analyzeJump(ts, mag);
  };
  let J = jump(0.4); t('Sprung 0,4 s Flug = etwa 19,6 cm', J.length === 1 && near(J[0], 19.6, 2.5), J.join());
  J = jump(0.55); t('Sprung 0,55 s Flug = etwa 37 cm', J.length === 1 && near(J[0], 37.1, 3.5), J.join());
  const still = []; const stT = []; for (let i = 0; i < 300; i++) { stT.push(i / 60); still.push(9.81 + (rnd() - 0.5) * 0.5); }
  t('Stehen ist kein Sprung', analyzeJump(stT, still).length === 0);

  // Atmung, Zittern, Balance
  const mot = (sec, fx) => { const S = { t: [], x: [], y: [], z: [] }; for (let i = 0; i < sec * 60; i++) { const tt = i / 60; S.t.push(tt); S.x.push(fx(tt) + (rnd() - 0.5) * 0.03); S.y.push((rnd() - 0.5) * 0.03); S.z.push(9.81 + (rnd() - 0.5) * 0.03); } return S; };
  let B = analyzeBreath(mot(60, tt => 0.3 * Math.sin(2 * Math.PI * 0.2 * tt)));

  Z = analyzeSteady(mot(30, tt => 0.3 * Math.sin(2 * Math.PI * 0.5 * tt)), 'balance');
  t('Schwanken 0,5 Hz: etwa 21 mg', Z && near(Z.mg, 21.3, 2.5), Z && Z.mg);
  Z = analyzeSteady(mot(30, tt => 0.2 * Math.sin(2 * Math.PI * 8 * tt)), 'balance');
  t('Balance blendet schnelles Zittern weitgehend aus', Z && Z.mg < 6, Z && Z.mg);

  // Wach-Check

  t('Wach-Check: zu wenige Reaktionen liefern nichts', pvtStats([300, 310]) === null);
  t('Wach-Check: genau an der Schwelle zählt als Aussetzer', pvtStats([200, 200, 200, 200, 500]).lapses === 1 && pvtStats([200, 200, 200, 200, 499]).lapses === 0);
  const wd = labText({ datum: '2026-11-16', wach: { ms: 295, lapses: 2, n: 40, slow: 620, fehl: 0 } });
  t('Wach-Check im Export', wd.includes('Wach-Check Reaktion: 295 ms') && wd.includes('Wach-Check Aussetzer: 2 mal') && wd.includes('"lab_wach_ms":295') && wd.includes('"lab_wach_aussetzer":2'), wd);
  t('Wach-Check: null Aussetzer werden exportiert', labText({ datum: '2026-11-16', wach: { ms: 280, lapses: 0, n: 40, slow: 400 } }).includes('"lab_wach_aussetzer":0'));

  // Resonanz: Puls 62 mit bekannter Schwankung im Atemtakt
  const rsa = (perMin, amp, look) => { const f = perMin / 60, P2 = ppg(tb => 60 / (62 + amp * Math.sin(2 * Math.PI * f * tb)), 75, 0.4), A2 = analyzePPG(P2.ts, P2.vs, 10); return A2 ? rsaSwing(A2.t, A2.ibi, A2.okIbi, look || perMin) : null; };
  let rs = rsa(6, 8); t('Resonanz: 16 Schläge Schwankung bei 6 pro Minute', rs !== null && near(rs, 16, 2.5), rs);
  rs = rsa(4.5, 4); t('Resonanz: 8 Schläge Schwankung bei 4,5 pro Minute', rs !== null && near(rs, 8, 2), rs);
  rs = rsa(6, 0); t('Resonanz: gleichmäßiger Puls schwankt kaum', rs !== null && rs < 1.5, rs);
  rs = rsa(6, 8, 4.5); t('Resonanz: Schwankung in anderem Takt zählt kaum mit', rs !== null && rs < 5, rs);
  t('Resonanz: beste Stufe nur unter brauchbaren', resonanzBest([{ rate: 6, swing: 9, q: 0.9 }, { rate: 5.5, swing: 14, q: 0.9 }, { rate: 5, swing: 30, q: 0.3 }, { rate: 4.5, swing: null, q: 0.9 }]).rate === 5.5 && resonanzBest([{ rate: 6, swing: null, q: 0.9 }]) === null);
  A = analyzePPG(ppg(() => 60 / 72, 60, 0.4).ts, ppg(() => 60 / 72, 60, 0.4).vs, 4);
  t('Puls liefert Schlagzeiten passend zu den Abständen', A && A.t.length === A.ibi.length && A.okIbi.length === A.ibi.length && near(A.t[5] - A.t[4], A.ibi[5], 1e-9));

  const lift = (reps, up, hold, down, rest, maxRad, lead) => { const S = { t: [], x: [], y: [], z: [] }, cyc = up + hold + down + rest, sec = lead + reps * cyc + 8;

      S.t.push(tt); S.x.push(9.81 * Math.sin(th) + (rnd() - 0.5) * 0.15); S.y.push((rnd() - 0.5) * 0.15); S.z.push(9.81 * Math.cos(th) + (rnd() - 0.5) * 0.15); } return S; };
  let TW = analyzeTempo(lift(5, 1, 0.5, 4, 1, 2.2, 2), 4);
  t('Tempo: 5 Wiederholungen, Heben 1 s, Ablassen 4 s', TW && TW.reps === 5 && near(TW.hin, 1, 0.25) && near(TW.rueck, 4, 0.4) && TW.treu === 100 && TW.fertig === 5, TW && JSON.stringify(TW));
  TW = analyzeTempo(lift(4, 1.5, 0, 1.5, 0.5, 1.4, 1), 4);
  t('Tempo: zu schnelles Ablassen fällt auf', TW && TW.reps === 4 && near(TW.rueck, 1.5, 0.3) && TW.treu === 0, TW && JSON.stringify(TW));
  TW = analyzeTempo(lift(3, 2, 1, 3, 1, 3.6, 1), 3);
  t('Tempo: auch über eine halbe Drehung hinaus', TW && TW.reps === 3 && near(TW.hin, 2, 0.35) && near(TW.rueck, 3, 0.4), TW && JSON.stringify(TW));
  t('Tempo: ruhiges Handy liefert nichts', analyzeTempo(lift(0, 1, 0, 1, 1, 2, 5), 4) === null);
  const half = lift(5, 1, 0.5, 4, 1, 2.2, 2), cut = half.t.findIndex(v => v >= 2 + 1 + 0.5 + 2), hs = { t: half.t.slice(0, cut), x: half.x.slice(0, cut), y: half.y.slice(0, cut), z: half.z.slice(0, cut) };
  TW = analyzeTempo(hs, 4); t('Tempo: laufendes Ablassen gilt noch nicht als fertig', TW && TW.reps === 1 && TW.fertig === 0, TW && JSON.stringify(TW));

  t('Solo-Tests stehen nicht im Morgen-Check', CHECK_ORDER.length === 9 && CHECK_ORDER.indexOf('tempo') < 0 && TEST_ORDER.every(id => TESTS[id] && TESTS[id].intro) && METRICS.every(m => TESTS[m.k]));

  // Werte, Schnitt, Export
  const days = {}; ['2026-11-10', '2026-11-11', '2026-11-12', '2026-11-13'].forEach((d, i) => { days[d] = { datum: d, reaktion: { ms: 280 + i * 10, fehl: 0 }, puls: { hr: 60, rmssd: 40, quality: i === 0 ? 0.3 : 0.9 } }; });
  t('Schnitt = Median frueherer Tage', baseline(METRICS[2], days, '2026-11-14') === 295);
  t('Schnitt erst ab 3 Werten', baseline(METRICS[2], days, '2026-11-12') === null);
  t('HRV bei schlechtem Signal zaehlt nicht', val(days['2026-11-10'], METRICS[1]) === null && val(days['2026-11-11'], METRICS[1]) === 40);
  const day = { datum: '2026-11-14', zeit: '06:40', puls: { hr: 58.4, rmssd: 42, quality: 0.93 }, reaktion: { ms: 285, fehl: 1 }, sprung: { cm: 24.5, alle: [22, 24.5] } };
  const txt = labText(day);
  t('Text: Kopfzeile', txt.startsWith('KOERPERLABOR 2026-11-14 (Sa) 06:40\nPuls: 58.4 /min\nHRV (RMSSD): 42 ms\nReaktion: 285 ms'), txt);
  t('Text: Sprung und Fehlstart', txt.includes('Sprung: 24.5 cm') && txt.includes('Fehlstarts Reaktion: 1'));
  let j = null; try { j = JSON.parse(txt.split('KOERPERLABOR-JSON-START\n')[1].split('\nKOERPERLABOR-JSON-ENDE')[0]); } catch (x) {}
  t('Text: JSON mit lab_-Feldern', j && j.lab_puls === 58.4 && j.lab_rmssd === 42 && j.lab_reaktion_ms === 285 && j.lab_sprung_cm === 24.5 && j.lab_zeit === '06:40' && !('lab_atem' in j));
  const bad = labText({ datum: '2026-11-14', puls: { hr: 70, rmssd: 90, quality: 0.4 } });
  t('Text: HRV bei schlechtem Signal nicht im Export', bad.includes('HRV: nicht gewertet') && bad.indexOf('lab_rmssd') < 0);
  t('Import lehnt Fremddaten ab', importText('{"app":"healthlog","days":{}}') !== null && importText('x') !== null);
  console.log('Selbsttest: ' + ok + ' OK, ' + fail + ' Fehler');
  return { ok, fail };
}
window.klTests = klTests;
if (/[?&]debug=1/.test(location.search)) window.KL_TEST = klTests();
